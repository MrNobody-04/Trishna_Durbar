<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="imperialGold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF9D2" />
      <stop offset="20%" stopColor="#FFE169" />
      <stop offset="45%" stopColor="#F59E0B" />
      <stop offset="75%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#854D0E" />
    </linearGradient>
    <linearGradient id="brightShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="30%" stopColor="#FEF08A" />
      <stop offset="70%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#B45309" />
    </linearGradient>
    <linearGradient id="rubyCrownJewel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FF4D6D" />
      <stop offset="50%" stopColor="#E11D48" />
      <stop offset="100%" stopColor="#881337" />
    </linearGradient>
    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FDE047" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#D97706" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- Dark Obsidian Shield Background -->
  <rect width="100" height="100" rx="22" fill="#0C0A09" stroke="#F59E0B" stroke-width="3" />

  <!-- Inner Ambient Glow -->
  <circle cx="50" cy="50" r="40" fill="url(#portalGlow)" opacity="0.3" />

  <!-- Pagoda Pinnacle Spire (Gajur) -->
  <path d="M50 7 L53.5 17 L46.5 17 Z" fill="url(#brightShine)" />
  <circle cx="50" cy="18" r="2.2" fill="url(#imperialGold24k)" />

  <!-- Pagoda Curved Eaves (Traditional Nepali Durbar) -->
  <path d="M50 19 C38 21.5, 29 25, 20 28 C25 30, 34 29, 50 28 C66 29, 75 30, 80 28 C71 25, 62 21.5, 50 19 Z" fill="url(#brightShine)" />
  <path d="M50 26.5 C39 28.5, 30 31.5, 16 35.5 C22 37.5, 32 36.5, 50 35.5 C68 36.5, 78 37.5, 84 35.5 C70 31.5, 61 28.5, 50 26.5 Z" fill="url(#imperialGold24k)" />

  <!-- Royal Crown Arch -->
  <path d="M25 40 C25 40, 34 48, 50 48 C66 48, 75 40, 75 40 L73 59 C73 66, 63 71, 50 71 C37 71, 27 66, 27 59 Z" fill="url(#imperialGold24k)" stroke="url(#brightShine)" stroke-width="0.8" />

  <!-- Crown Jewels -->
  <circle cx="27" cy="39" r="2.5" fill="url(#brightShine)" />
  <circle cx="38" cy="35.5" r="2.3" fill="url(#brightShine)" />
  <circle cx="50" cy="32" r="3.2" fill="url(#rubyCrownJewel)" stroke="url(#brightShine)" stroke-width="0.8" />
  <circle cx="62" cy="35.5" r="2.3" fill="url(#brightShine)" />
  <circle cx="73" cy="39" r="2.5" fill="url(#brightShine)" />

  <!-- Durbar Torana Arch Gateway -->
  <path d="M35 50 C35 42, 65 42, 65 50 L65 77 L35 77 Z" fill="#030303" stroke="url(#brightShine)" stroke-width="1.5" />
  <path d="M41 55 C41 48, 59 48, 59 55 L59 77 L41 77 Z" fill="url(#portalGlow)" stroke="url(#imperialGold24k)" stroke-width="1" />

  <!-- Base Plinth -->
  <path d="M20 77 L80 77 L76 84 L24 84 Z" fill="url(#imperialGold24k)" />
  <path d="M16 84 L84 84 L80.5 90 L19.5 90 Z" fill="url(#brightShine)" />

  <!-- Royal 8-pointed star -->
  <polygon points="50,58 52,63 57.5,63 53,66.5 55,72 50,68.5 45,72 47,66.5 42.5,63 48,63" fill="url(#brightShine)" />
</svg>
